<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Contrato - Versus Apple Oficial</title>

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,Arial;
background:#fff;
padding:20px;
}

.container{
max-width:750px;
margin:auto;
}

h1{
text-align:center;
color:#6a0dad;
}

.empresa{
font-size:14px;
margin-bottom:20px;
border-bottom:1px solid #ccc;
padding-bottom:10px;
}

.box{
background:#f5f5f7;
padding:15px;
border-radius:12px;
margin-top:30px;
}

input,button{
width:100%;
padding:14px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
}

button{
background:#6a0dad;
color:white;
font-weight:bold;
}

.aceite{
display:flex;
gap:10px;
margin-top:10px;
}

/* LOADING */
#loading{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.85);
color:white;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:18px;
text-align:center;
padding:20px;
}

.fade{
transition:0.3s;
}
</style>
</head>

<body>

<div class="container">

<h1>CONTRATO DE COMPRA</h1>

<div class="empresa">
VERSUS APPLE OFICIAL<br>
WhatsApp: +55 11 94496-7694
</div>

<div class="box">

<b>Nome do titular</b>
<input type="text" id="nome">

<label class="aceite">
<input type="checkbox" id="ok">
<span>Declaro que li e aceito os termos</span>
</label>

<button onclick="finalizar()">FINALIZAR CONTRATO</button>

</div>

</div>

<!-- LOADING -->
<div id="loading">
<div id="texto">Iniciando sistema...</div>
</div>

<script>

function gerarNumero(){
return Math.floor(100000 + Math.random()*900000);
}

function setTexto(txt){
document.getElementById("texto").innerText = txt;
}

function finalizar(){

let nome = document.getElementById("nome").value;
let ok = document.getElementById("ok").checked;

if(!nome || !ok){
alert("Preencha todos os campos");
return;
}

document.getElementById("loading").style.display = "flex";

let numero = gerarNumero();

let etapas = [
"Processando dados do cliente...",
"Validando informações...",
"Gerando contrato digital...",
"Aplicando assinatura eletrônica...",
"Finalizando sistema...",
"Pronto! Redirecionando..."
];

let i = 0;

let intervalo = setInterval(()=>{

setTexto(etapas[i]);
i++;

if(i >= etapas.length){
clearInterval(intervalo);

setTimeout(()=>{

document.getElementById("loading").style.display = "none";

let mensagem = `CONTRATO DE COMPRA FORMALIZADO N° ${numero}

Cliente: ${nome}

A etapa final consiste somente no pagamento da entrada.
Os boletos serão encaminhados ao e-mail em formato PDF.`;

let tel = "5511944967694";

window.location.href =
"https://wa.me/" + tel + "?text=" + encodeURIComponent(mensagem);

},800);

}

},800);

}

</script>

</body>
</html>
