<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Contrato - Versus Apple Oficial</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================
   BASE
========================= */
body {
  font-family: -apple-system, BlinkMacSystemFont, "San Francisco", Arial;
  background: #ffffff;
  padding: 20px;
}

.container {
  max-width: 750px;
  margin: auto;
}

/* título */
h1 {
  text-align: center;
  color: #6a0dad;
}

/* =========================
   LOADING SCREEN
========================= */
#loading {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  color: white;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9999;
  text-align: center;
}

.bar {
  width: 80%;
  height: 10px;
  background: #333;
  border-radius: 10px;
  margin-top: 20px;
  overflow: hidden;
}

.progress {
  width: 0%;
  height: 100%;
  background: #6a0dad;
  transition: 0.3s;
}

/* =========================
   FORM
========================= */
.box {
  margin-top: 30px;
}

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  background: #6a0dad;
  color: white;
  font-weight: bold;
}

/* assinatura */
.assinatura {
  margin-top: 40px;
  border-top: 2px solid #000;
  padding-top: 15px;
}

</style>
</head>

<body>

<div class="container">

<h1>CONTRATO DIGITAL</h1>

<!-- assinatura visual -->
<div class="assinatura" id="assinatura">
<b>ASSINATURA ELETRÔNICA</b><br><br>
Nome: —<br>
Status: pendente
</div>

<!-- input -->
<div class="box">
<input id="nome" placeholder="Nome completo">

<label>
<input type="checkbox" id="confirmacao">
Declaro que aceito os termos
</label>

<button onclick="finalizar()">FINALIZAR CONTRATO</button>
</div>

</div>

<!-- =========================
     LOADING UI
========================= -->
<div id="loading">
<h2>📄 Processando contrato...</h2>
<div class="bar">
  <div class="progress" id="progress"></div>
</div>
<p id="statusText">Inicializando sistema...</p>
</div>

<script>

/* =========================
   GERADOR CÓDIGO
========================= */
function gerarCodigo(){
return Math.random().toString(36).substring(2,8).toUpperCase();
}

/* =========================
   SOM (CONFIRMAÇÃO)
========================= */
function som(){
let audio = new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");
audio.play();
}

/* =========================
   LOCALIZAÇÃO (IP)
========================= */
async function pegarLocalizacao(){
try{
let r = await fetch("https://ipapi.co/json/");
let d = await r.json();
return d.city + " - " + d.region;
}catch{
return "Não identificada";
}
}

/* =========================
   FUNÇÃO PRINCIPAL
========================= */
async function finalizar(){

let nome = document.getElementById("nome").value;
let ok = document.getElementById("confirmacao").checked;

if(!nome || !ok){
alert("Preencha tudo");
return;
}

/* mostra loading */
document.getElementById("loading").style.display = "flex";

let progress = 0;
let bar = document.getElementById("progress");
let text = document.getElementById("statusText");

/* anima progresso */
let interval = setInterval(() => {
progress += 10;
bar.style.width = progress + "%";

if(progress == 30) text.innerHTML = "Validando dados...";
if(progress == 60) text.innerHTML = "Gerando PDF...";
if(progress == 90) text.innerHTML = "Finalizando contrato...";
if(progress >= 100) clearInterval(interval);

}, 300);

/* dados */
let data = new Date().toLocaleDateString();
let hora = new Date().toLocaleTimeString();
let local = await pegarLocalizacao();
let codigo = gerarCodigo();
let protocolo = Date.now();

/* assinatura visual */
document.getElementById("assinatura").innerHTML =
`<b>ASSINATURA ELETRÔNICA</b><br><br>
Nome: ${nome}<br>
Status: VALIDADO ✔`;

/* espera final */
setTimeout(() => {

/* PDF */
const { jsPDF } = window.jspdf;
const doc = new jsPDF();

/* nome arquivo limpo */
let nomeArquivo = nome.replace(/\s/g,"_");

/* conteúdo PDF */
doc.text("CONTRATO DIGITAL", 10, 10);
doc.text("Cliente: " + nome, 10, 25);
doc.text("Data: " + data, 10, 35);
doc.text("Hora: " + hora, 10, 45);
doc.text("Local: " + local, 10, 55);
doc.text("Código: " + codigo, 10, 65);
doc.text("Protocolo: " + protocolo, 10, 75);
doc.text("Assinatura: " + nome, 10, 95);

/* download silencioso */
const blob = doc.output("blob");
const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = `Contrato_${nomeArquivo}.pdf`;
a.click();

/* som */
som();

/* WhatsApp depois */
setTimeout(() => {

let msg = `📄 CONTRATO FORMALIZADO ⚖️

👤 Cliente: ${nome}
📅 Data: ${data}
⏰ Hora: ${hora}
📍 Local: ${local}

🔐 Código: ${codigo}
🧾 Protocolo: ${protocolo}

📎 Documento gerado automaticamente com assinatura digital ✔`;

let tel = "5511944967694";

document.getElementById("loading").style.display = "none";

window.location.href =
`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`;

}, 2000);

}, 3000);

}

</script>

</body>
</html>
